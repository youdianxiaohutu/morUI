﻿<!DOCTYPE html>
<html lang="zh-CN" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: row;
      background: linear-gradient(180deg, #2D1B33, #1a1a2e) no-repeat center center fixed;
background-size: cover;
      color: #fff;
    }

    /* 左侧导航 */
    .sidebar {
      width: 160px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.3);
      border-right: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }
    .sidebar-title {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      font-size: 15px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active {
      background: rgba(0,212,255,0.1);
      border-left-color: #00d4ff;
      color: #00d4ff;
    }

    /* 右侧主区域 */
      .main {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .pages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .page {
      display: none;
    }
    .page.active { display: block; }

    /* 页面内容区 */
    .page {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
    }
    .page.active { display: block; }

    /* ===== 状态卡 ===== */
    .status-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      max-width: 1000px;
    }
        .char-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .char-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }
    .section {
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 3px solid #00d4ff;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-top: 12px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
    }
    .stat-item .name { color: rgba(255,255,255,0.7); }
    .stat-item .value { font-weight: bold; color: #ffd700; }
    .char-name {
      font-size: 24px;
      font-weight: bold;
      color: #00d4ff;
      margin-bottom: 24px;
      text-align: center;
    }
    .stat-row { margin-bottom: 18px; }
    .stat-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .stat-label .name { color: rgba(255,255,255,0.7); }
    .stat-label .value { font-weight: bold; }
    .progress-bg {
      position: relative;
      height: 14px;
      background: rgba(255,255,255,0.1);
      border-radius: 7px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 7px;
      transition: width 0.4s ease;
    }
    .hp-bar { background: linear-gradient(90deg, #ff8a8a, #c0392b); }
    .mp-bar { background: linear-gradient(90deg, #85c1e9, #2471a3); }
    .xp-bar { background: linear-gradient(90deg, #f9e79f, #d4ac0d); }


    /* ===== 重要角色 ===== */
        .roles-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .role-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      max-width: 700px;
    }
    .role-card .char-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .role-card .char-name {
      font-size: 24px;
      font-weight: bold;
      color: #00d4ff;
    }
    .role-card .char-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }
    .role-card .section {
      margin-bottom: 16px;
    }
    .role-card .section-title {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 3px solid #00d4ff;
    }
    .role-card .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-top: 12px;
    }
    .role-card .stat-item {
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      font-size: 14px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
    }
    .role-card .stat-item .name { color: rgba(255,255,255,0.7); }
    .role-card .stat-item .value { font-weight: bold; color: #ffd700; }
    .add-role-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: rgba(0,212,255,0.1);
      border: 1px dashed rgba(0,212,255,0.5);
      border-radius: 8px;
      color: #00d4ff;
      cursor: pointer;
      text-align: center;
      max-width: 200px;
      margin-left: auto;
      margin-right: auto;
    }
    .add-role-btn:hover {
      background: rgba(0,212,255,0.2);
    }


    /* ===== 聊天区 ===== */
      .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid rgba(255,255,255,0.1);
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
    }
    .chat-header {
      padding: 15px 20px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .chat-header h1 { font-size: 18px; color: #00d4ff; }
    .header-center {
      flex: 1;
      max-width: 280px;
      margin: 0 12px;
    }
    .search-input {
      width: 100%;
      padding: 6px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: rgba(0,212,255,0.5);
    }
    .search-input::placeholder {
      color: rgba(255,255,255,0.35);
    }
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 16px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom-left-radius: 4px;
    }
    .message.error {
      align-self: center;
      background: rgba(255,107,107,0.2);
      color: #ff6b6b;
      border: 1px solid rgba(255,107,107,0.3);
    }
    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }
    .typing-indicator span {
      display: inline-block;
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      margin: 0 2px;
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

    /* 输入区 */
      .input-container {
      padding: 15px 20px;
      background: transparent;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: auto;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #messageInput {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 50px;
      max-height: 150px;
      font-family: inherit;
      transition: all 0.3s;
    }
    #messageInput::placeholder { color: rgba(255,255,255,0.35); }
    #messageInput:focus { border-color: #00d4ff; background: rgba(255,255,255,0.12); }
    .send-btn {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      border: none; border-radius: 12px;
      color: #fff; font-size: 20px;
      cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,212,255,0.4); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  

  
    /* 右上角个性化按钮 */

    .options-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      max-height: 38vh;
      overflow-y: auto;
    }
    .opt-btn {
      padding: 8px 12px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 8px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .opt-btn:hover {
      background: rgba(0,212,255,0.2);
      border-color: rgba(0,212,255,0.6);
      color: #fff;
    }
    .custom-btn {
      position: fixed;
      top: 20px;
      right: 140px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      color: #00ff88;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }
    .custom-btn:hover {
      background: rgba(0, 255, 136, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
    }

    .end-sim-btn {
      background: rgba(255, 60, 60, 0.12);
      border: 1px solid rgba(255, 60, 60, 0.4);
      border-radius: 8px;
      padding: 6px 14px;
      color: #ff6b6b;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .end-sim-btn:hover {
      background: rgba(255, 60, 60, 0.25);
      border-color: rgba(255, 80, 80, 0.7);
      color: #ff8a8a;
      box-shadow: 0 0 12px rgba(255, 60, 60, 0.3);
    }

    /* ===== 设置页 ===== */
    .color-btn {
      padding: 10px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
    }
    .color-btn.active {
      border-color: #00d4ff;
      background: rgba(0,212,255,0.15);
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      display: inline-block;
    }
    #colorPreview .message {
      font-size: 14px;
    }

    :root {
      --text-color: #ffffff;
    }
    .message.ai { color: var(--text-color) !important; }
    .message.user { color: var(--text-color) !important; }
    .char-name { color: var(--text-color) !important; }
    .char-meta { color: var(--text-color) !important; }
    .section-title { color: var(--text-color) !important; }
    .stat-label .name, .stat-item .name { color: var(--text-color) !important; }
    .stat-label .value, .stat-item .value { color: var(--text-color) !important; }
    .field-label { color: var(--text-color) !important; }
    .field-value { color: var(--text-color) !important; }

</style>
  <script src="memory.js"></script>
  <script src="types/generic.js"></script>
</head>
<body>
  <div id="rawMeta" style="display:none;"></div>
  <div class="sidebar">
    <div class="sidebar-title"></div>
    <div class="nav-item active" data-page="status" onclick='switchPage("status")'>📊 状态卡</div>
    <div class="nav-item" data-page="roles" onclick='switchPage("roles")'>🎭 重要角色</div>
    <div class="nav-item" onclick="showSaveLoadUI()">&#x1F4BE; 存档/读档</div>
    <div class="nav-item" style="margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);border-left:none;" onclick="openCustom()">&#x1F4A0; 个性化</div>
    <div class="nav-item" onclick="switchPage('settings')">&#x2699;设置</div>
  </div>
  <div class="main">
    <div class="pages-container">
      <div class="page active" id="page-status">
        <div class="status-card">
          <div class="char-header">
            <div class="char-name" id="charName">加载中...</div>
            <div class="char-meta" id="charMeta">加载中...</div>
          </div>
          <div class="section">
            <div class="stat-row"><div class="stat-label"><span class="name">境界</span><span class="value" id="realmValue">❰ 加载中 ❱</span></div></div>
            <div class="stat-row"><div class="stat-label"><span class="name">灵根</span><span class="value" id="linggenValue">❰ -- ❱</span></div></div>
            <div class="stat-row"><div class="stat-label"><span class="name">突破</span><span class="value" id="xpValue">--%</span></div><div class="progress-bg"><div class="progress-bar xp-bar" id="xpBar" style="width:0%"></div></div></div>
            <div class="stat-row"><div class="stat-label"><span class="name">寿元</span><span class="value" id="lifeValue">--/-- 年</span></div><div class="progress-bg"><div class="progress-bar xp-bar" id="lifeBar" style="width:0%"></div></div></div>
          </div>
          <div class="section">
            <div class="stat-row"><div class="stat-label"><span class="name">气血</span><span class="value" id="hpValue">--/--</span></div><div class="progress-bg"><div class="progress-bar hp-bar" id="hpBar" style="width:0%"></div></div></div>
            <div class="stat-row"><div class="stat-label"><span class="name">灵气</span><span class="value" id="mpValue">--/--</span></div><div class="progress-bg"><div class="progress-bar mp-bar" id="mpBar" style="width:0%"></div></div></div>
          </div>
          <div class="section">
            <div class="section-title">▎六维根基</div>
            <div class="stats-grid" id="statsGrid">
              <div class="stat-item"><span class="name">根骨</span><span class="value" id="rootValue">❰ -- ❱</span></div>
              <div class="stat-item"><span class="name">神识</span><span class="value" id="spiritValue">❰ -- ❱</span></div>
              <div class="stat-item"><span class="name">身法</span><span class="value" id="agilityValue">❰ -- ❱</span></div>
              <div class="stat-item"><span class="name">悟性</span><span class="value" id="insightValue">❰ -- ❱</span></div>
              <div class="stat-item"><span class="name">气运</span><span class="value" id="luckValue">❰ -- ❱</span></div>
              <div class="stat-item"><span class="name">魅力</span><span class="value" id="charmValue">❰ -- ❱</span></div>
            </div>
          </div>
          <div class="section"><div class="stat-row"><div class="stat-label"><span class="name">状态</span><span class="value" id="statusValue">❰ 加载中 ❱</span></div></div></div>
          <div class="section"><div class="stat-row"><div class="stat-label"><span class="name">灵石</span><span class="value" id="stoneValue">❰ 加载中 ❱</span></div></div></div>
        </div>
      </div>
      <div class="page" id="page-roles">
        <div class="roles-container" id="rolesContainer"></div>
      </div>
      </div>
      <div class="page" id="page-settings">
        <div class="status-card">
          <div class="char-header">
            <div class="char-name">字体颜色设置</div>
          </div>
          <div class="section">
            <div class="section-title">选择字体颜色</div>
            <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;">
              <button class="color-btn" data-color="#ffffff" onclick="setMsgColor('#ffffff')"><span class="color-dot" style="background:#fff;border-color:#666"></span>白色</button>
              <button class="color-btn" data-color="#000000" onclick="setMsgColor('#000000')"><span class="color-dot" style="background:#000;border-color:#666"></span>黑色</button>
              <button class="color-btn" data-color="#ffd700" onclick="setMsgColor('#ffd700')"><span class="color-dot" style="background:#ffd700;border-color:#b8860b"></span>黄色</button>
            </div>
          </div>
          <div class="section" style="margin-top:20px;">
            <div class="section-title">自动压缩</div>
            <div style="display:flex;align-items:center;gap:12px;margin-top:16px;">
              <input type="checkbox" id="autoCompressToggle" style="width:18px;height:18px;cursor:pointer;accent-color:#00ff88;">
              <label for="autoCompressToggle" style="cursor:pointer;font-size:14px;">启用自动压缩</label>
            </div>
            <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:8px;line-height:1.6;">
              开启后，可手动设置触发压缩的 token 阈值；达到该数值时自动把旧剧情压缩为摘要，并保留最近 8 条原文。
            </div>
            <div style="display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;">
              <label for="autoCompressThresholdInput" style="font-size:14px;">压缩阈值(tokens)</label>
              <input type="number" id="autoCompressThresholdInput" min="1000" step="1000" style="width:140px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:8px 10px;font-size:14px;">
            </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='game.html'">← 返回</button>
        <div class="header-center">
          <input class="search-input" id="searchInput" type="text" placeholder="搜索聊天记录..." oninput="searchMessages(event)">
        </div>
        <span class="model-info" id="modelInfo">加载中...</span>
        <button class="end-sim-btn" onclick="sendEndSimMessage()">结束模拟</button>
      </div>
      <div class="chat-container" id="chatContainer">
        <div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>
      </div>  
      <div class="input-container" id="inputContainer"></div>
      <div class="options-row" id="optionsRow"></div>
      <div class="input-wrapper">
      <textarea id="messageInput" placeholder="输入消息..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      </div>
    </div>
  </div>

    
  <script>

    // ===== 配置（从 localStorage 读取，与 login.html 一致）=====
    function loadConfig() {
      return {
        baseUrl: localStorage.getItem('baseUrl') || 'http://localhost:8080/v1',
        apiKey: localStorage.getItem('apiKey') || '',
        modelName: localStorage.getItem('modelName') || 'default-model'
      };
    }

    let config = loadConfig();
    // ===== 四层记忆模块（新增，不改现有逻辑） =====
    var _mem = (typeof Memory !== 'undefined') ? Memory.createMemory({ vocab: (typeof GENERIC_VOCAB !== 'undefined') ? GENERIC_VOCAB : undefined }) : null;
    function memRemember(resp, meta) { if (_mem) _mem.remember(resp, meta); }
    function memRecall(ctx) { return _mem ? _mem.recall(ctx) : ''; }

    let chatHistory = [];
    const CONTEXT_WINDOW = 512000;
    let storyRecap = '';

    function isAutoCompressEnabled() {
      const raw = localStorage.getItem('autoCompress');
      return raw === null ? true : raw === '1';
    }

    function getAutoCompressThresholdTokens() {
      const raw = localStorage.getItem('autoCompressThreshold');
      const parsed = raw ? parseInt(raw, 10) : NaN;
      if (Number.isFinite(parsed) && parsed >= 1000) return parsed;
      const toggle = document.getElementById('autoCompressThresholdInput');
      const manual = toggle ? parseInt(toggle.value, 10) : NaN;
      if (Number.isFinite(manual) && manual >= 1000) return manual;
      return 400000;
    }

    async function summarizeOldMessages(oldMessages) {
      const chunks = oldMessages.map((msg, index) => {
        return '[' + index + '] ' + (msg.role === 'user' ? '玩家' : 'AI') + ': ' + msg.content;
      }).join('\n\n');
      const response = await fetch(config.baseUrl.endsWith('/v1')
        ? config.baseUrl + '/chat/completions'
        : config.baseUrl + '/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + config.apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: config.modelName,
          messages: [
            {
              role: 'system',
              content: '你是跑团叙事记录员。请把旧剧情压缩成一份“当前可继续”的摘要。必须保留：当前场景、当前目标、已发生关键事件、重要NPC状态、未解决冲突、玩家已做选择。不要编造，只写摘要。'
            },
            { role: 'user', content: chunks }
          ],
          max_tokens: 1800,
          temperature: 0.1,
          stream: false
        })
      });
      if (!response.ok) throw new Error('摘要请求失败: ' + response.status);
      const data = await response.json();
      const summary = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!summary) throw new Error('摘要结果为空');
      return summary.trim();
    }

    async function compressContextIfNeeded(allMessages) {
      if (!isAutoCompressEnabled()) return;
      const total = allMessages.reduce((sum, m) => sum + estimateContextTokens(m && m.content), 0);
      const threshold = getAutoCompressThresholdTokens();
      if (total < threshold) return;

      const oldMessages = chatHistory.slice(0, Math.max(0, chatHistory.length - 20));
      if (oldMessages.length < 4) return;

      try {
        storyRecap = await summarizeOldMessages(oldMessages);
        chatHistory = chatHistory.slice(-20);
      } catch (error) {
        console.warn('[CONTEXT] 自动压缩失败，回退为最近20条原文', error);
        storyRecap = oldMessages.map((m) => (m.role === 'user' ? '玩家' : 'AI') + ': ' + m.content).join('\n\n');
        chatHistory = chatHistory.slice(-20);
      }
    }

    function estimateContextTokens(text) {
      if (!text) return 0;
      const s = String(text);
      const cjk = (s.match(/[一-鿿]/g) || []).length;
      return Math.ceil((s.length / 4 + cjk) * 1.15);
    }

    function logContextUsage(messages) {
      const total = (messages || []).reduce((sum, m) => sum + estimateContextTokens(m && m.content), 0);
      const threshold = getAutoCompressThresholdTokens();
      const usagePercent = Math.round((total / Math.max(1, threshold)) * 10000) / 100;
      console.log(`[CONTEXT] total=${total} tokens | threshold=${threshold} | current_usage=${usagePercent}%`);
    }

      try {

    const roles = [];
    // ===== 增量更新运行时状态（纯内存 + 局部刷新，不写文件） =====
    const roleOverlay = {};   // key: role文件编号(1-based)，值: 部分变化字段
    let runtimeRoles = [];    // 会话内新增的角色: {id, data}
    let maxFileRoleId = 0;    // ztk/others 里实际存在的最大 role 编号
    let fileRoleData = {};    // roleId(1-based) → 文件角色合并 overlay 后的数据缓存（供按名字定位角色）
    let lastUpdatedSections = [];
    let roleCounter = 1;

    function mergeObject(base, extra) {
      for (const k in extra) {
        const v = extra[k];
        if (v !== undefined && v !== null && typeof v === "object" && !Array.isArray(v) &&
            base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) {
          mergeObject(base[k], v);
        } else if (v !== undefined) {
          base[k] = v;
        }
      }
      return base;
    }

    function applyRoleDeltas(list) {
      for (const item of (list || [])) {
        if (!item) continue;
        const { index, ...fields } = item;
        // 按名字优先合并：模型可能把 index 传错（按本次数组顺序重排），但每次都会传 name；
        // 命中已有角色时忽略 index，直接合并到名字对应的角色
        if (typeof fields.name === 'string' && fields.name) {
          const target = findRoleByName(fields.name);
          if (target) {
            if (index !== undefined && index !== null && index !== target.globalIndex) {
              console.warn('[ROLES] index 与名字不一致，已按名字合并: ' + fields.name + ' -> [' + target.globalIndex + '] (传入 index=' + index + ')');
            }
            mergeObject(target.data, fields);
            continue;
          }
        }
        // 玩家本人不属于重要角色：名字与玩家一致则忽略该项
        if (charStats.name && typeof fields.name === 'string' && fields.name === charStats.name) {
          console.warn('[ROLES] 玩家本人 (' + charStats.name + ') 被写进 roles，已忽略');
          continue;
        }
        // 防 index 错路由：该 index 已被其他名字的角色占用时，不覆盖，按新角色追加到末尾
        if (index !== undefined && index !== null) {
          const occupant = getRoleNameAtGlobalIndex(index);
          if (occupant && typeof fields.name === 'string' && fields.name && occupant !== fields.name) {
            console.warn('[ROLES] index=' + index + ' 已属于 ' + occupant + '，本项为 ' + fields.name + '，不覆盖，已按新角色追加');
            const id = maxFileRoleId + runtimeRoles.length + 1;
            const data = {
              name: `角色${id}`, gender: "", appearance: "", realm: "", linggen: "",
              status: "", stones: "", breakthrough: "", favor: 0,
              hp: { current: "", max: "" }, mp: { current: "", max: "" }, life: { current: "", max: "" },
              stats: { root: "", spirit: "", agility: "", insight: "", luck: "", charm: "" }
            };
            mergeObject(data, fields);
            runtimeRoles.push({ id, data });
            continue;
          }
        }
        if (index === undefined || index === null) {
          // 新增角色：接在现有角色后面
          const id = maxFileRoleId + runtimeRoles.length + 1;
          const data = {
            name: `角色${id}`, gender: "", appearance: "", realm: "", linggen: "",
            status: "", stones: "", breakthrough: "", favor: 0,
            hp: { current: "", max: "" }, mp: { current: "", max: "" }, life: { current: "", max: "" },
            stats: { root: "", spirit: "", agility: "", insight: "", luck: "", charm: "" }
          };
          mergeObject(data, fields);
          runtimeRoles.push({ id, data });
        } else if (index + 1 <= maxFileRoleId) {
          // 指向文件角色（role1..roleN）
          const rid = index + 1;
          roleOverlay[rid] = mergeObject(roleOverlay[rid] || {}, fields);
        } else {
          // 指向不存在的编号 → 按位置补建运行时角色（中间缺位也补齐）
          const rj = index - maxFileRoleId;
          while (runtimeRoles.length <= rj) {
            const id = maxFileRoleId + runtimeRoles.length + 1;
            const data = {
              name: `角色${id}`, gender: "", appearance: "", realm: "", linggen: "",
              status: "", stones: "", breakthrough: "", favor: 0,
              hp: { current: "", max: "" }, mp: { current: "", max: "" }, life: { current: "", max: "" },
              stats: { root: "", spirit: "", agility: "", insight: "", luck: "", charm: "" }
            };
            runtimeRoles.push({ id, data });
          }
          mergeObject(runtimeRoles[rj].data, fields);
        }
      }
    }

    function findRoleByName(name) {
      for (let rid = 1; rid <= maxFileRoleId; rid++) {
        let d = fileRoleData[rid];
        if (roleOverlay[rid]) {
          d = d ? JSON.parse(JSON.stringify(d)) : {};
          mergeObject(d, roleOverlay[rid]);
        }
        if (d && d.name === name) {
          roleOverlay[rid] = roleOverlay[rid] || {};
          return { globalIndex: rid - 1, data: roleOverlay[rid] };
        }
      }
      for (let j = 0; j < runtimeRoles.length; j++) {
        if ((runtimeRoles[j].data.name || '') === name) {
          return { globalIndex: maxFileRoleId + j, data: runtimeRoles[j].data };
        }
      }
      return null;
    }

    // 重要角色显示条件：favor<0 或 favor>70（与提示词引导对齐的前端兜底）
    function isKeyRoleVisible(data) {
      let f = Number(data ? data.favor : '');
      if (!isFinite(f)) f = 0;
      return f < 0 || f > 70;
    }

    function getRoleNameAtGlobalIndex(gi) {
      if (gi + 1 <= maxFileRoleId) {
        const rid = gi + 1;
        let d = fileRoleData[rid];
        if (roleOverlay[rid]) {
          d = d ? JSON.parse(JSON.stringify(d)) : {};
          mergeObject(d, roleOverlay[rid]);
        }
        return d ? (d.name || '') : '';
      }
      const rj = gi - maxFileRoleId;
      if (rj >= 0 && rj < runtimeRoles.length) return runtimeRoles[rj].data.name || '';
      return '';
    }

    // 同名角色合并：把后来者（runtime）的非空字段并入先到者（文件 overlay 或更早的 runtime），并移除重复项
    function mergeNonEmpty(base, extra) {
      for (const k in extra) {
        const v = extra[k];
        if (v === undefined || v === null || v === '' || v === 0) continue;
        if (typeof v === 'object' && !Array.isArray(v)) {
          if (!base[k] || typeof base[k] !== 'object' || Array.isArray(base[k])) base[k] = {};
          mergeNonEmpty(base[k], v);
        } else {
          base[k] = v;
        }
      }
      return base;
    }

    function consolidateDuplicateRoles() {
      const targets = {};
      for (let rid = 1; rid <= maxFileRoleId; rid++) {
        let d = fileRoleData[rid];
        if (roleOverlay[rid]) {
          d = d ? JSON.parse(JSON.stringify(d)) : {};
          mergeObject(d, roleOverlay[rid]);
        }
        const nm = d ? (d.name || '') : '';
        if (nm) {
          roleOverlay[rid] = roleOverlay[rid] || {};
          targets[nm] = { data: roleOverlay[rid] };
        }
      }
      for (let j = 0; j < runtimeRoles.length; j++) {
        const nm = runtimeRoles[j].data.name || '';
        if (!nm) continue;
        if (targets[nm]) {
          mergeNonEmpty(targets[nm].data, runtimeRoles[j].data);
          runtimeRoles.splice(j, 1);
          j--;
        } else {
          targets[nm] = { data: runtimeRoles[j].data };
        }
      }
    }

          if (roleOverlay[roleId]) mergeObject(data, roleOverlay[roleId]);
          fileRoleData[roleId] = data;
          return data;
        }
      } catch(e) {}
      return null;
    }

    async function loadAllRoles() {
      const container = document.getElementById('rolesContainer');
      container.innerHTML = '';
      let i = 1;
      maxFileRoleId = 0;
      while (true) {
        if (!(await loadRole(i))) break;
        maxFileRoleId = i;
        i++;
      }
      consolidateDuplicateRoles();
      i = 1;
      while (true) {
        const roleData = await loadRole(i);
        if (!roleData) break;
        maxFileRoleId = i;
        if (isKeyRoleVisible(roleData) && !(charStats.name && roleData.name === charStats.name)) {
          const card = renderRoleCard(roleData, i - 1);
          container.appendChild(card);
        }
        i++;
      }
      for (let j = 0; j < runtimeRoles.length; j++) {
        if (charStats.name && runtimeRoles[j].data.name === charStats.name) continue;
        if (!isKeyRoleVisible(runtimeRoles[j].data)) continue;
        const card = renderRoleCard(runtimeRoles[j].data, maxFileRoleId + j);
        card.id = `role-card-${maxFileRoleId + j}`;
        container.appendChild(card);
      }
      roleCounter = Math.max(roleCounter, maxFileRoleId + runtimeRoles.length + 1);
    }

    function lenientParse(buf) {
      if (!buf || buf.length < 2) return null;
      try { return JSON.parse(buf); } catch (e) {}
      let s = buf.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
      try { return JSON.parse(s); } catch (e) {}
      s = s.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)(\s*):/g, '$1"$2"$3:');
      try { return JSON.parse(s); } catch (e) {}
      s = buf.replace(/'/g, '"');
      try { return JSON.parse(s); } catch (e) {}
      // 先修内层未转义引号/裸换行，再基于修复后的串做截断补全
      const repaired = repairInnerQuotes(buf);
      try { return JSON.parse(repaired); } catch (e) {}
      try {
        let inStr = false, esc = false;
        const stack = [];
        for (const ch of repaired) {
          if (inStr) {
            if (esc) esc = false;
            else if (ch === '\\') esc = true;
            else if (ch === '"') inStr = false;
          } else {
            if (ch === '"') inStr = true;
            else if (ch === '{' || ch === '[') stack.push(ch);
            else if (ch === '}') stack.pop();
            else if (ch === ']') stack.pop();
          }
        }
        let out = repaired;
        if (inStr) out += '"';
        out = out.replace(/,\s*$/, '').replace(/:\s*$/, ':""');
        for (let i = stack.length - 1; i >= 0; i--) out += stack[i] === '{' ? '}' : ']';
        if (out !== repaired) return JSON.parse(out);
      } catch (e) {}
      return null;
    }

    function repairInnerQuotes(s) {
      if (!s) return '';
      let out = '', inStr = false, esc = false;
      for (let i = 0; i < s.length; i++) {
        const ch = s[i];
        if (esc) { out += ch; esc = false; continue; }
        if (ch === '\\') { out += ch; esc = true; continue; }
        if (ch === '"') {
          if (!inStr) { inStr = true; out += ch; continue; }
          let j = i + 1;
          while (j < s.length && ' \t\n\r'.includes(s[j])) j++;
          const next = s[j];
          if (next === ',' || next === '}' || next === ']' || next === ':' || next === undefined) {
            inStr = false; out += ch;
          } else {
            out += '\\"';
          }
          continue;
        }
        if (inStr && ch === '\n') { out += '\\n'; continue; }
        out += ch;
      }
      return out;
    }

      async function runStreamOnce() {
        try {
        const apiUrl = config.baseUrl.endsWith('/v1')
          ? config.baseUrl + '/chat/completions'
          : config.baseUrl + '/v1/chat/completions';

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + config.apiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: config.modelName,
            messages: await getMessagesWithSystem(),
            functions: FUNCTION_DEFS,
            max_tokens: 65536,
            stream: true
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || '请求失败: ' + response.status);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let aiMessage = '';
        let toolBuffer = '';
        let toolExecuted = false;
        let bodyShown = false;
        let hideStreamDom = !!window.__retryHideDom;
        window._lastToolCallId = '';
        const chatContainer = document.getElementById('chatContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        let streamMsgDiv = null;
        function ensureStreamDiv() {
          if (!streamMsgDiv) {
            streamMsgDiv = document.createElement('div');
            streamMsgDiv.className = 'message ai';
            if (hideStreamDom) streamMsgDiv.style.display = 'none';
            chatContainer.insertBefore(streamMsgDiv, typingIndicator);
          }
          return streamMsgDiv;
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') break;
              try {
                const json = JSON.parse(data);
                const delta = json.choices[0].delta;
                
                // 处理工具调用
                if (delta.tool_calls) {
                  // 如果是新的 tool_call，清空 buffer
                  if (delta.tool_calls[0].id !== window._lastToolCallId) {
                    toolBuffer = '';
                    window._lastToolCallId = delta.tool_calls[0].id;
                  }
                  for (const tc of delta.tool_calls) {
                    if (tc.function && tc.function.arguments) {
                      toolBuffer += tc.function.arguments;
                    }
                    // 实时尝试解析
                    if (tc.finish_reason || toolBuffer.length > 20) {
                      const testArgs = lenientParse(toolBuffer);
                      if (testArgs) {
                        console.log('[DEBUG] 工具参数已缓存:', testArgs);
                        window._cachedChatToolArgs = testArgs;
                        window._lastToolCallId = tc.id;
                        toolExecuted = true;
                      }
                    }
                  }
                }
                
                // 全程先缓冲正文，流结束或工具开始后再由外层决定何时显示，避免打回时闪内容
                const content = delta.content;
                if (content) {
                  aiMessage += content;
                }
              } catch (e) {}
            }
          }
        }
        console.log('[SEND] 流结束, aiMessage长度:', aiMessage.length);
        console.log('[SEND] toolBuffer长度:', toolBuffer.length);
        console.log('[SEND] toolBuffer前50字:', toolBuffer.substring(0, 50));
          if (!toolExecuted && toolBuffer.length > 20) {
          const finalArgs = lenientParse(toolBuffer);
          if (finalArgs) {
            console.log('[DEBUG] 流结束兜底解析成功，缓存工具参数');
            window._cachedChatToolArgs = finalArgs;
            toolExecuted = true;
          } else {
            try { JSON.parse(toolBuffer); } catch (e2) {
              const mm = e2.message.match(/position (\d+)/);
              const pos = mm ? +mm[1] : 0;
              console.error('[SEND] 解析错误:', e2.message, '出错位置上下文:', JSON.stringify(toolBuffer.slice(Math.max(0, pos - 40), pos + 40)));

        window.__lastRunStreamBodyShown = bodyShown;

          if (!bubbles.length) return;
          const lastAi = bubbles[bubbles.length - 1];
          if (lastAi && (lastAi.textContent || '').trim() === text.trim()) lastAi.remove();
        }
        function pushUserReject(message) {
          chatHistory.push({ role: 'user', content: message });
        }
        const first = await runStreamOnce();
        const bodyLength = first.aiMessage ? first.aiMessage.trim().length : 0;
        console.log('[RETRY] 检查是否打回', { toolExecuted: first.toolExecuted, aiMessageLength: bodyLength });
        if (bodyLength > 20) {

    async function saveGame(slot) {
      try {
        var statsJson = JSON.stringify(charStats, null, 2);

        var chatLog = "";
        if (chatHistory && chatHistory.length > 0) {
          for (var i = 0; i < chatHistory.length; i++) {
            var msg = chatHistory[i];
            var role = msg.role === "user" ? "玩家" : "AI";
            chatLog += role + ": " + msg.content + "\n\n";
          }
        }
        var data = {
          version: "1.0",
          slot: slot,
          timestamp: new Date().toISOString(),
          stats: statsJson,
          roles: rolesJson,
          chatLog: chatLog,
          memory: _mem ? _mem.exportMemory() : null
        };
        var res = await fetch(API_BASE + "/save/" + slot, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          await refreshSaveList();
          renderSaveSlots();
          updateStatsUI();
          loadAllRoles();
          alert("存档 " + slot + " 成功！");

    async function loadGame(slot) {
      try {
        var res = await fetch(API_BASE + "/load/" + slot);
        if (!res.ok) {
          alert("存档 " + slot + " 不存在");
          return;
        }
        var data = await res.json();
        if (data.stats) charStats = JSON.parse(data.stats);
        if (data.roles) {
          roles.length = 0;
          var loadedRoles = JSON.parse(data.roles);
          for (var i = 0; i < loadedRoles.length; i++) roles.push(loadedRoles[i]);
        }
        // ===== 读档还原记忆（新增） =====
        if (data.memory && _mem) { try { _mem.importMemory(data.memory); } catch (e) { console.warn('[MEM] 读档还原记忆失败', e); } }
        chatHistory = [];
        var chatContainer = document.getElementById("chatContainer");
        var typingIndicator = document.getElementById("typingIndicator");
        chatContainer.innerHTML = "";
        chatContainer.appendChild(typingIndicator);
        if (data.chatLog) {
          var allLines = data.chatLog.split("\n");
          var curRole = null;
          var curContent = [];
          function flushMsg() {
            if (curRole && curContent.length > 0) {
              chatHistory.push({role: curRole, content: curContent.join("\n").trim()});
            }
            curRole = null;
            curContent = [];
          }
          for (var j = 0; j < allLines.length; j++) {
            var line = allLines[j];
            if (line.startsWith("玩家:")) {
              flushMsg();
              curRole = "user";
              curContent.push(line.substring(3));
            } else if (line.startsWith("AI:")) {
              flushMsg();
              curRole = "assistant";
              curContent.push(line.substring(3));
            } else if (curRole !== null) {
              curContent.push(line);
            }
          }
          flushMsg();
          for (var k = 0; k < chatHistory.length; k++) {
            var msg = chatHistory[k];
            var div = document.createElement("div");
            div.className = "message " + (msg.role === "user" ? "user" : "ai");
            div.textContent = msg.content;
            chatContainer.insertBefore(div, typingIndicator);
          }

        }

        window.updateQichaStatus();
        alert("读档 " + slot + " 成功！");
      } catch(e) {
        alert("读档失败: " + e.message);
      }
    }

    function searchMessages(e) {
      if (e) e.preventDefault();
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const chatContainer = document.getElementById('chatContainer');
      const messages = document.querySelectorAll('#chatContainer .message');
      messages.forEach(function(m) {
        if (!query) {
          if (m.dataset.origHtml) { m.innerHTML = m.dataset.origHtml; delete m.dataset.origHtml; }
          m.style.display = '';
          return;
        }
        const text = m.textContent;
        const lowerText = text.toLowerCase();
        const idx = lowerText.indexOf(query);
        if (idx === -1) { m.style.display = 'none'; return; }
        m.style.display = '';
        if (!m.dataset.origHtml) m.dataset.origHtml = m.innerHTML;
        const before = text.slice(0, idx);
        const match = text.slice(idx, idx + query.length);
        const after = text.slice(idx + query.length);
        m.innerHTML = escHtml(before) + '<mark style="background:#ff4444;color:white;border-radius:2px;padding:0 2px;">' + escHtml(match) + '</mark>' + escHtml(after);
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    var dl = new THREE.DirectionalLight(0xffffff, 1.4);
    dl.position.set(3, 5, 4);
    scene.add(dl);
    var pl = new THREE.PointLight(0xff4444, 0.8, 20);
    pl.position.set(-3, 2, 3);
    scene.add(pl);
    var geo = new THREE.IcosahedronGeometry(1.3, 0);
    var normAttr = geo.getAttribute("normal");
    var faceCount = geo.index ? geo.index.count / 3 : normAttr.count / 3;
    var mat = new THREE.MeshPhysicalMaterial({ color: 0xcc2233, roughness: 0.2, metalness: 0.1, clearcoat: 0.8, clearcoatRoughness: 0.1, flatShading: true });
    var edgesGeo = new THREE.EdgesGeometry(geo);
    var edgesMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
    var edges = new THREE.LineSegments(edgesGeo, edgesMat);
    dice = new THREE.Group();
    var mesh = new THREE.Mesh(geo, mat);
    dice.add(mesh);
    dice.add(edges);
    scene.add(dice);
    function makeNumberTexture(n) {
      var c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      var ctx = c.getContext("2d");
      ctx.clearRect(0, 0, 128, 128);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 72px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 10;
      ctx.fillText(String(n), 64, 64);
      var tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      return tex;
    }
    var posAttr = geo.getAttribute("position");
    var faceCenters = [];
    for (var i = 0; i < faceCount; i++) {
      var cx = (posAttr.getX(i * 3) + posAttr.getX(i * 3 + 1) + posAttr.getX(i * 3 + 2)) / 3;
      var cy = (posAttr.getY(i * 3) + posAttr.getY(i * 3 + 1) + posAttr.getY(i * 3 + 2)) / 3;
      var cz = (posAttr.getZ(i * 3) + posAttr.getZ(i * 3 + 1) + posAttr.getZ(i * 3 + 2)) / 3;
      faceCenters.push(new THREE.Vector3(cx, cy, cz));
    }
    for (var si = 0; si < faceCount; si++) {
      var planeGeo = new THREE.PlaneGeometry(0.42, 0.42);
      var planeMat = new THREE.MeshBasicMaterial({ map: makeNumberTexture(si + 1), transparent: true, depthTest: true, side: THREE.FrontSide });
      var plane = new THREE.Mesh(planeGeo, planeMat);
      var center = faceCenters[si];
      plane.position.copy(center).multiplyScalar(1.005);
      plane.lookAt(center.clone().multiplyScalar(2));
      dice.add(plane);
    }
    function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
    function animate() { requestAnimationFrame(animate); if (!isRolling && !hasRolled) { dice.rotation.x += 0.008; dice.rotation.y += 0.012; } renderer.render(scene, camera); }
    animate();
    diceCanvas.addEventListener("click", function(e) {
      e.stopPropagation();
      if (isRolling) return;
      if (hasRolled) { diceOverlay.style.display = "none"; return; }
      isRolling = true;
      diceResult.textContent = "";
      var resultFace = Math.floor(Math.random() * faceCount);
      var faceNormal = new THREE.Vector3(normAttr.getX(resultFace * 3), normAttr.getY(resultFace * 3), normAttr.getZ(resultFace * 3));
      var targetQuat = new THREE.Quaternion().setFromUnitVectors(faceNormal, new THREE.Vector3(0, 0, 1));
      var targetEuler = new THREE.Euler().setFromQuaternion(targetQuat, "YXZ");
      var ySpins = (4 + Math.floor(Math.random() * 4)) * Math.PI * 2;
      var xSpins = (3 + Math.floor(Math.random() * 3)) * Math.PI * 2;
      var startRotX = dice.rotation.x, startRotY = dice.rotation.y;
      var finalRotX = targetEuler.x + xSpins, finalRotY = targetEuler.y + ySpins;
      var duration = 2200, start = performance.now();
      function step(now) {
        var elapsed = now - start, t = Math.min(elapsed / duration, 1), e = easeOutExpo(t);
        dice.rotation.x = startRotX + (finalRotX - startRotX) * e;
        dice.rotation.y = startRotY + (finalRotY - startRotY) * e;
        if (t < 1) { requestAnimationFrame(step); }
        else {
          isRolling = false;
          hasRolled = true;
          dice.rotation.x = targetEuler.x;
          dice.rotation.y = targetEuler.y;
          diceResult.textContent = resultFace+1;
          // 检查棋差一招
          if (window._lastOptionText && window._lastPrevMsg) {
            window.checkQichaYizhao(window._lastAttr, resultFace+1);
          }
        }
      }
      requestAnimationFrame(step);
    });
    diceOverlay.addEventListener("click", function(e) {
      if (e.target === diceOverlay && hasRolled) { diceOverlay.style.display = "none"; }
    });
  }
  initDice();

  // 获取上一轮对话
  window.getLastMessage = function() {
    var chatContainer = document.getElementById("chatContainer");
    if (!chatContainer) return "";
    var messages = chatContainer.querySelectorAll(".message");
    if (messages.length < 2) return "";
    var lastMsg = messages[messages.length - 2];
    return lastMsg ? lastMsg.textContent.trim() : "";
  };

  // 棋差一招历史记录
  var qichaHistory = JSON.parse(localStorage.getItem('qichaHistory') || '[]');
  window.qichaHistory = qichaHistory;
  var qichaAchieved = localStorage.getItem('qichaAchieved') === 'true';
  window.qichaAchieved = qichaAchieved;

  // 记录棋差一招
  window.recordQicha = function(attr, optionValue, diceValue, playerAttrValue, prevMsg) {
    var record = {
      attr: attr,
      optionValue: optionValue,
      diceValue: diceValue,
      playerAttrValue: playerAttrValue,
      prevMsg: prevMsg,
      time: new Date().toISOString()
    };
    qichaHistory.push(record);
    localStorage.setItem('qichaHistory', JSON.stringify(qichaHistory));
    window.qichaHistory = qichaHistory;
  };

  // 检查棋差一招条件
  window.checkQichaYizhao = function(attr, diceValue) {
    if (qichaAchieved) return;
    var re = new RegExp('[（(]' + attr + '[:：]\\s*([0-9]+)\\s*[）)]');
    var optionMatch = window._lastOptionText && window._lastOptionText.match(re);
    console.log('[QICHA] attr=' + attr + ' dice=' + diceValue + ' optText=' + window._lastOptionText);
    if (!optionMatch) { console.log('[QICHA] no regex match'); return; }
    var optionValue = parseInt(optionMatch[1]);
    var attrKeyMap = {'根骨':'root','神识':'spirit','身法':'agility','悟性':'insight','气运':'luck','魅力':'charm'};
    var attrVal = charStats.stats && charStats.stats[attrKeyMap[attr]];
    var playerAttrValue = attrVal ? parseInt(attrVal) : 0;
    console.log('[QICHA] optVal=' + optionValue + ' attrVal=' + attrVal + ' playerAttr=' + playerAttrValue + ' charStats.stats=' + JSON.stringify(charStats.stats));
    if (optionValue - diceValue - playerAttrValue === 1) {
      var prevMsg = window._lastPrevMsg || '';
      console.log('[QICHA] MATCH! prevMsg=' + prevMsg + ' history len=' + qichaHistory.length);
      window.recordQicha(attr, optionValue, diceValue, playerAttrValue, prevMsg);
      if (qichaHistory.length >= 3) {
        var last = qichaHistory[qichaHistory.length - 1];
        var mid = qichaHistory[qichaHistory.length - 2];
        var prev = qichaHistory[qichaHistory.length - 3];
        console.log('[QICHA] last=' + JSON.stringify(last) + ' prev=' + JSON.stringify(prev) + ' mid=' + JSON.stringify(mid));
        if (last.prevMsg === mid.prevMsg && mid.prevMsg === prev.prevMsg && last.prevMsg !== '') {
          qichaAchieved = true;
          localStorage.setItem('qichaAchieved', 'true');
          alert('成就解锁：天命难违');
        }
      }
    }
  };

  
  // 更新棋差一招状态（在读档后调用）
  window.updateQichaStatus = function() {
    qichaHistory = JSON.parse(localStorage.getItem('qichaHistory') || '[]');
    qichaAchieved = localStorage.getItem('qichaAchieved') === 'true';
    window.qichaHistory = qichaHistory;
    window.qichaAchieved = qichaAchieved;
  };

  window.rollDiceIfNeeded = function(optionText) {
    var attrs = ["根骨", "神识", "身法", "悟性", "气运", "魅力"];
    for (var i = 0; i < attrs.length; i++) {
      var re = new RegExp("[（(]" + attrs[i] + "[:：]\s*[0-9]+\s*[）)]");
      if (re.test(optionText)) {
        diceAttrLabel.textContent = attrs[i] + " 投掷";
        diceResult.textContent = "";
        hasRolled = false;
        isRolling = false;
        diceOverlay.style.display = "flex";
        return attrs[i];
      }
    }
    return null;
  };
})();

    
    function setMsgColor(color) {
      localStorage.setItem('msgColor', color);
      document.documentElement.style.setProperty('--text-color', color);
      // Update preview
      var preview = document.getElementById('colorPreview');
      if (preview) {
        preview.style.color = color;
      }
      // Active button
      document.querySelectorAll('.color-btn').forEach(function(btn) {
        btn.classList.remove('active');
        if (btn.getAttribute('data-color') === color) {
          btn.classList.add('active');
        }
      });
    }
    // Load saved color on page load
    (function() {
      var saved = localStorage.getItem('msgColor');
      if (saved) setMsgColor(saved);
    })();
